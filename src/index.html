<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;" />
  <title>FontMaker</title>
  <link rel="stylesheet" href="styles/theme.css" />
  <link rel="stylesheet" href="styles/layout.css" />
</head>
<body>
  <!-- ================= TOP BAR ================= -->
  <header id="topbar" class="glass">
    <div id="logo" class="logo" title="glypho — FontMaker"></div>
    <nav id="menubar" class="menubar"></nav>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <button class="btn-import" data-action="file:import">⤓ Import</button>
      <button class="btn-export" data-action="file:export">⤒ Export</button>
    </div>
  </header>

  <!-- ================= CONTROL PANEL ================= -->
  <div id="control-panel" class="glass">
    <div id="tool-controls" class="tool-controls"></div>
    <div id="global-controls" class="global-controls"></div>
  </div>

  <!-- ================= BODY: toolbar + boards ================= -->
  <div id="workspace">
    <aside id="toolbar" class="glass"></aside>
    <main id="boards"></main>
  </div>

  <!-- ================= TEST BAR (bottom, light) ================= -->
  <div id="testbar" class="testbar collapsed">
    <button id="testbar-toggle" class="testbar-toggle" title="Sample text tester">▲</button>
    <div class="testbar-body">
      <input id="testbar-input" type="text" value="Handgloves" spellcheck="false" />
      <div class="testbar-controls">
        <label>Size <input id="testbar-size" type="range" min="24" max="220" value="96" /></label>
        <span id="testbar-master-label"></span>
      </div>
      <div id="testbar-render" class="testbar-render"></div>
    </div>
  </div>

  <!-- ================= MODAL ROOT ================= -->
  <div id="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
