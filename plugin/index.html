<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="bar">
      <span class="brand">Font<b>Maker</b></span>
      <span class="sub">Illustrator → Font</span>
    </header>

    <section class="panel">
      <div class="row">
        <label>Family</label>
        <input id="familyName" type="text" value="My Typeface" />
      </div>
      <div class="row">
        <label>Style</label>
        <input id="styleName" type="text" value="Regular" />
      </div>
      <div class="row">
        <label>Designer</label>
        <input id="designer" type="text" placeholder="optional" />
      </div>
    </section>

    <section class="assign">
      <div class="hint">Select artwork in Illustrator, click a slot, then Assign.</div>
      <button id="assignBtn" class="primary" disabled>Assign selection → <b id="assignTarget">—</b></button>
    </section>

    <section class="gridwrap">
      <div id="grid" class="grid"></div>
    </section>

    <footer class="foot">
      <div id="status" class="status">Ready.</div>
      <div class="actions">
        <span id="filledCount" class="count">0 glyphs</span>
        <button id="exportBtn" class="export">Export OTF</button>
      </div>
    </footer>
  </div>
  <script src="panel.js"></script>
</body>
</html>
