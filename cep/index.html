<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: file:;" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>FontMaker</title>
</head>
<body>
<div id="app">

  <!-- ============ PAGE 1 — New Font (RuneType Glyphmaker) ============ -->
  <div id="view-new" class="view rune">
    <!-- header: logo + font name + masters -->
    <header class="rune-head">
      <img class="rune-logo" src="assets/logo.png" alt="RuneType" />
      <div class="rune-fields">
        <div class="rfield">
          <label>Font Name</label>
          <input id="nf-family" type="text" placeholder="ex. RuneType Sans" />
        </div>
        <div class="rfield">
          <label>Masters</label>
          <div class="masters">
            <button id="m-add" class="m-plus" title="Add the master named on the right">+</button>
            <input id="m-name" class="m-name" type="text" value="Regular" />
            <div class="m-dd">
              <button id="m-ddbtn" class="m-ddbtn" title="Manage masters">▾</button>
              <div id="m-list" class="m-list hidden"></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- settings heading -->
    <div class="rune-sec">
      <img class="hword" src="assets/h-settings.png" alt="settings" />
      <div class="sec-desc">Customize detailed font generation settings, including multilingual support, grid structures, and other advanced options.</div>
      <img class="ul" src="assets/ul-settings.png" alt="" />
    </div>

    <!-- body: left (toggles + profile + actions) | right (shared list) -->
    <div class="rune-body">
      <div class="rune-left">
        <button id="tg-lang" class="pill"><span id="tg-lang-lbl">Language Support</span><i class="pill-ar">▶</i></button>
        <button id="tg-grid" class="pill"><span id="tg-grid-lbl">Supported Grids</span><i class="pill-ar">▶</i></button>

        <div class="prof-head">
          <img class="hword sm" src="assets/h-profile.png" alt="profile" />
          <span class="prof-sub">Current settings.<br/>Be sure.</span>
        </div>
        <img class="ul ul-sm" src="assets/ul-profile.png" alt="" />
        <div id="profile" class="prof-body"></div>

        <div class="rune-actions">
          <button id="nf-import" class="rune-btn outline">Import Your Project</button>
          <button id="nf-create" class="rune-btn blue">Start Creating</button>
        </div>
      </div>

      <div class="rune-right">
        <div id="rune-list" class="rune-list"></div>
      </div>
    </div>
  </div>

  <!-- ============ PAGE 2 — Workspace ============ -->
  <div id="view-work" class="view hidden">
    <header class="bar">
      <span class="brand">Font<b>Maker</b></span>
      <button id="w-newfont" class="mini">＋ Font</button>
    </header>
    <div id="w-tabs" class="tabs"></div>

    <section class="assign">
      <div class="hint">Draw on a glyph's artboard (it syncs live), or select art and Assign to a slot.</div>
      <button id="assignBtn" class="primary" disabled>Assign selection → <b id="assignTarget">—</b></button>
      <div class="special">
        <button id="altBtn" class="ghost-btn" disabled title="Stylistic alternate of the selected glyph (X.ssNN)">＋ Alternate</button>
        <input id="ligInput" class="lig-input" type="text" placeholder="ft" title="Characters to ligate" />
        <button id="ligBtn" class="ghost-btn" title="Make a ligature (e.g. f_t)">＋ Ligature</button>
      </div>
    </section>

    <section class="gridwrap"><div id="grid" class="grid"></div></section>

    <!-- font tester -->
    <section id="tester" class="tester">
      <div class="tester-paper"><input id="t-text" type="text" value="Handgloves 0123" spellcheck="false" /></div>
      <div class="tester-ctl">
        <label>Size<input id="t-size" type="range" min="12" max="120" value="44" /></label>
        <label>Track<input id="t-track" type="range" min="-40" max="120" value="0" /></label>
        <label>Kern<select id="t-kern"><option value="normal">Optical</option><option value="none">Metric</option></select></label>
        <label class="dim">Var<input id="t-var" type="range" min="0" max="100" value="50" disabled /></label>
      </div>
    </section>

    <footer class="foot">
      <div id="status" class="status">Ready.</div>
      <div class="actions">
        <input id="designer" class="mini-input" type="text" placeholder="Designer (for export)" />
        <span id="filledCount" class="count">0</span>
        <button id="exportBtn" class="export" disabled>Export OTF</button>
      </div>
    </footer>
  </div>

</div>
<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
