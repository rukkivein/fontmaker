<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: file:;" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>FontMaker</title>
</head>
<body>
<div id="app">

  <!-- ============ PAGE 1 — New Font ============ -->
  <div id="view-new" class="view">
    <header class="bar">
      <span class="brand">Font<b>Maker</b></span><span class="sub">New Font</span>
      <button id="nf-cancel" class="mini hidden">Cancel</button>
    </header>
    <div class="scroll">
      <div class="grp">
        <div class="row"><label>Name</label><input id="nf-family" type="text" value="My Typeface" /></div>
        <div class="row"><label>Version</label><input id="nf-version" type="text" value="1.000" /></div>
        <div class="row"><label>Master</label><select id="nf-mastertype"></select></div>
      </div>

      <div class="grp">
        <div class="grp-title">Character sets</div>
        <div class="dropdown">
          <button id="nf-cs-btn" class="dd-btn" type="button"><span id="nf-cs-summary">Select…</span><i class="dd-caret">▾</i></button>
          <div id="nf-cs-list" class="dd-list hidden"></div>
        </div>
      </div>

      <div class="grp">
        <div class="grp-title">Construction grids <span class="muted">overlay allowed</span></div>
        <div id="nf-grids" class="grids"></div>
        <div id="nf-gridwarn" class="warn hidden"></div>
      </div>
    </div>
    <footer class="foot">
      <div id="nf-status" class="status"></div>
      <button id="nf-create" class="export">Create Font</button>
    </footer>
  </div>

  <!-- ============ PAGE 2 — Workspace ============ -->
  <div id="view-work" class="view hidden">
    <header class="bar">
      <span class="brand">Font<b>Maker</b></span>
      <button id="w-newfont" class="mini">＋ Font</button>
    </header>
    <div id="w-tabs" class="tabs"></div>

    <section class="assign">
      <div class="hint">Select artwork in Illustrator, click a slot, then Assign (or double-click a slot).</div>
      <button id="assignBtn" class="primary" disabled>Assign selection → <b id="assignTarget">—</b></button>
    </section>

    <section class="gridwrap"><div id="grid" class="grid"></div></section>

    <!-- font tester -->
    <section id="tester" class="tester">
      <div class="tester-paper"><input id="t-text" type="text" value="Handgloves 0123" spellcheck="false" /></div>
      <div class="tester-ctl">
        <label>Size<input id="t-size" type="range" min="12" max="120" value="44" /></label>
        <label>Track<input id="t-track" type="range" min="-40" max="120" value="0" /></label>
        <label>Kern<select id="t-kern"><option value="normal">Optical</option><option value="none">Metric</option></select></label>
        <label class="dim">Var<input id="t-var" type="range" min="0" max="100" value="50" disabled /></label>
      </div>
    </section>

    <footer class="foot">
      <div id="status" class="status">Ready.</div>
      <div class="actions">
        <input id="designer" class="mini-input" type="text" placeholder="Designer (for export)" />
        <span id="filledCount" class="count">0</span>
        <button id="exportBtn" class="export" disabled>Export OTF</button>
      </div>
    </footer>
  </div>

</div>
<script src="js/CSInterface.js"></script>
<script src="js/main.js"></script>
</body>
</html>
